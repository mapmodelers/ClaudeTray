<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<style>
:root{--bg:#262624;--card:#30302e;--tx:#eeece2;--mu:#9a978d;--ln:#3b3a37;--acc:#d97757}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:11.5px/1.45 "Segoe UI Variable Text","Segoe UI",sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}
.ib{width:16px;height:16px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:var(--mu)}
.ib:hover{background:var(--ln);color:var(--tx)}.ib.on{color:var(--acc)}
#app{display:flex;flex-direction:column;height:100%}
#head{display:flex;align-items:center;gap:3px;padding:2px 5px 2px 9px;flex:none;border-bottom:1px solid var(--ln);user-select:none}
#title{flex:1;min-width:0;color:var(--mu);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#body{flex:1;overflow-y:auto;padding:7px 11px;user-select:text;overscroll-behavior:contain}
#body p{margin:0 0 7px}#body ul,#body ol{margin:0 0 7px;padding-left:18px}
#body pre{background:var(--card);border-radius:6px;padding:5px 8px;overflow:auto;margin:0 0 7px}
#body code{font-family:Consolas,monospace;font-size:10.5px;background:var(--card);padding:0 3px;border-radius:3px}#body pre code{background:none;padding:0;white-space:pre}
#body table{border-collapse:collapse;font-size:10.5px;margin:0 0 7px}#body th,#body td{border:1px solid var(--ln);padding:2px 6px;text-align:left}
#body h1,#body h2,#body h3,#body h4,#body h5,#body h6{font-size:12px;margin:9px 0 3px}
#body blockquote{margin:0 0 7px;padding-left:8px;border-left:3px solid var(--ln);color:var(--mu)}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--ln);border-radius:3px}
#body a{color:var(--act,#6296d6);text-decoration:underline;cursor:pointer}</style></head>
<body><div id="app"><div id="head"><span id="title"></span>
<button class="ib" id="copy" title="Copy"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/></svg></button>
<button class="ib" id="pin" title="Keep open"></button>
<button class="ib" id="x" title="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
<div id="body"></div></div>
<script>
'use strict';
// reading column next to the panel. Content = a reply already reduced to a tag whitelist; cleaned again here (inert DOMParser).
const $ = s => document.querySelector(s), post = m => window.chrome.webview.postMessage(m);
const PIN = '<svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-4 4h12l-4-4V3M12 13v8"/></svg>', UNPIN = '<svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-4 4h12l-4-4V3M12 13v8M3 3l18 18"/></svg>';
const OK = new Set(['P','BR','UL','OL','LI','PRE','CODE','STRONG','B','EM','I','H1','H2','H3','H4','H5','H6','TABLE','THEAD','TBODY','TR','TH','TD','BLOCKQUOTE','HR','DEL','S']);
function clean(html){ const d = new DOMParser().parseFromString('<div>' + (html || '') + '</div>', 'text/html'); const walk = n => { for (const c of [...n.childNodes]) { if (c.nodeType === 1) { walk(c); if (c.tagName === 'A' && /^https?:\/\/[^\s"<>]+$/i.test(c.getAttribute('data-href') || '')) { const h = c.getAttribute('data-href'); for (const a of [...c.attributes]) c.removeAttribute(a.name); c.setAttribute('data-href', h); c.setAttribute('title', h); continue; } if (!OK.has(c.tagName)) c.replaceWith(...c.childNodes); else for (const a of [...c.attributes]) c.removeAttribute(a.name); } else if (c.nodeType !== 3) c.remove(); } }; const r = d.body.firstChild; walk(r); return r.innerHTML; }
let pinned = false, key = '', html = '';
function setPin(on){ pinned = on; $('#pin').innerHTML = on ? UNPIN : PIN; $('#pin').classList.toggle('on', on); $('#pin').title = on ? 'Unpin' : 'Keep open'; }
setPin(false);
document.addEventListener('mouseenter', () => post({ type: 'hover', on: true }));
document.documentElement.addEventListener('mouseenter', () => post({ type: 'hover', on: true }));
document.documentElement.addEventListener('mouseleave', () => post({ type: 'hover', on: false }));
document.addEventListener('mousedown', () => post({ type: 'focus' }));
$('#pin').onclick = () => { setPin(!pinned); post({ type: 'pin', on: pinned }); };
$('#x').onclick = () => { setPin(false); post({ type: 'close' }); };
$('#copy').onclick = () => post({ type: 'copy', text: $('#body').innerText });
document.addEventListener('click', e => { const lk = e.target.closest && e.target.closest('a[data-href]'); if (lk) { e.preventDefault(); post({ type: 'openurl', url: lk.getAttribute('data-href') }); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { setPin(false); post({ type: 'close' }); } });
document.addEventListener('wheel', e => { if (e.ctrlKey) { e.preventDefault(); post({ type: 'zoom', d: e.deltaY < 0 ? 1 : -1 }); } }, { passive: false });
window.chrome.webview.addEventListener('message', e => {
  const m = e.data;
  if (m.type === 'theme') document.documentElement.style.cssText = Object.entries(m.theme).map(([k, v]) => '--' + k + ':' + v).join(';');
  else if (m.type === 'show') {
    $('#title').textContent = m.title || '';
    const h = clean(m.html);
    if (m.key !== key) { key = m.key; html = h; $('#body').innerHTML = h; $('#body').scrollTop = 0; }
    else if (h !== html) { const b = $('#body'), atEnd = b.scrollHeight - b.scrollTop - b.clientHeight < 20; html = h; b.innerHTML = h; if (atEnd) b.scrollTop = b.scrollHeight; }
    if (typeof m.pinned === 'boolean') setPin(m.pinned);
    post({ type: 'shown', len: ($('#body').innerText || '').length });
  }
});
post({ type: 'ready' });
</script></body></html>
